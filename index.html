<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Manna</title>
<meta name="description" content="Daily devotional articles from the SCC Bible reading plan.">
<!-- Public so it reads anywhere without a VPN, but kept out of search. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#EEF2EC">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Manna">
<!-- Loaded without blocking the first paint: offline or on a slow phone
     connection the page draws at once in the fallback fonts. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Nunito+Sans:wght@800&display=swap">
<style>
  :root {
    --bg: #EEF2EC;
    --paper: #FFFFFF;
    --line: #DCE3D9;
    --ink: #17291F;
    --mute: #55665B;
    --green: #1F5A43;
    --green-deep: #174634;
    --green-soft: #E1ECE4;
    --gold: #8C6414;
    --gold-soft: #F6EBD3;
    --gold-line: #E8D3A4;
    --head: Fraunces, Georgia, serif;
    --ui: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Charter", "Iowan Old Style", "Palatino", Georgia, serif; /* article prose */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 16px;
    line-height: normal;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--green); }
  button { font: inherit; color: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .narrow { display: none; }

  /* ---------- top row + back-to-board ---------- */
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 28px; }
  .sp { flex: 1; }
  .obback {
    height: 40px; min-width: 44px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); text-decoration: none;
    display: inline-flex; align-items: center; gap: 3px; padding: 0 8px 0 5px; flex: none;
  }
  .obl {
    width: 28px; height: 28px; border-radius: 8px; background: #3563E9; color: #fff;
    display: grid; place-items: center; font-family: "Nunito Sans", system-ui, sans-serif;
    font-weight: 800; font-size: 12px;
  }
  .build { font-size: 12px; color: var(--mute); }
  .foot-build { display: none; text-align: center; }
  .top-k { display: none; }
  .k { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }

  /* ---------- home column ---------- */
  .col { width: 100%; max-width: 880px; margin: 0 auto; padding: 8px 28px 40px; display: flex; flex-direction: column; gap: 20px; }
  .hero { display: flex; flex-direction: column; gap: 6px; }
  .hero h1 { font-family: var(--head); font-size: 44px; font-weight: 600; letter-spacing: -.01em; line-height: 1.05; }
  .sub { font-size: 15px; color: var(--mute); }

  .reads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .rd { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .rd .l { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--green); }
  .rd .v { font-family: var(--head); font-size: 19px; font-weight: 600; line-height: 1.25; }
  a.ref { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--line); }
  a.ref:hover { color: var(--green); border-bottom-color: var(--green); }

  .big {
    display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left;
    padding: 20px 22px; border-radius: 18px; border: 0; cursor: pointer;
  }
  .big b { font-family: var(--head); font-size: 22px; font-weight: 600; }
  .big span { font-size: 13.5px; opacity: .85; }
  .big.p { background: var(--green); color: #fff; }
  .big.p:hover { background: var(--green-deep); }
  .big.s { background: var(--paper); color: var(--ink); border: 1.5px solid var(--green); }
  .big[disabled] { opacity: .6; cursor: default; }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { font-family: var(--head); font-size: 19px; font-weight: 600; }
  .card p { color: var(--mute); font-size: 14.5px; }
  .hint { font-size: 12.5px; color: var(--mute); }

  /* browse by date: a short row of days, and a field for anything older */
  .browse-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .days { display: flex; gap: 8px; flex-wrap: wrap; }
  .dy {
    min-width: 64px; height: 62px; border-radius: 14px; border: 1px solid var(--line); background: var(--paper);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: var(--ink); cursor: pointer; padding: 0 6px;
  }
  .dy small { font-size: 11px; color: var(--mute); font-weight: 600; }
  .dy b { font-size: 16px; }
  .dy:hover { border-color: var(--green); }
  .dy.on { background: var(--green); border-color: var(--green); color: #fff; }
  .dy.on small { color: rgba(255, 255, 255, .85); }
  .dy.f { background: var(--gold-soft); border-color: var(--gold-line); }
  .dy.none { opacity: .55; }
  .look { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .look label { font-size: 13px; color: var(--mute); }
  .look input {
    height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    padding: 0 10px; font: inherit; font-size: 13.5px; color: var(--ink);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px;
    padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper);
    color: var(--ink); font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--green); }
  .btn.g { background: var(--green-soft); border-color: transparent; color: var(--green); }
  .btn[disabled] { opacity: .6; cursor: default; }

  /* tools: regenerate, next 7 days, Mac server */
  .tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .tools.n1 { grid-template-columns: minmax(0, 1fr); }
  .tools.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tool { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .tool .x { display: flex; flex-direction: column; gap: 6px; }
  .tool .h { font-weight: 700; font-size: 14px; }
  .tool .d { font-size: 12.5px; color: var(--mute); line-height: 1.45; }
  .done { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 10px; background: var(--green-soft); color: var(--green); }
  .gen-note { font-size: 13px; color: var(--mute); min-height: 1.2em; }
  .gen-note:empty { display: none; }
  .cta .gen-note, .missing-card .gen-note { margin-top: 6px; }

  .day-nav { display: flex; gap: 8px; margin-top: 6px; }

  /* ---------- reading top bar ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 880px; margin: 0 auto; padding: 8px 28px;
    display: flex; align-items: center; gap: 10px;
  }
  .topbar .where { margin-left: auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; font-weight: 700; color: var(--mute); letter-spacing: .12em; text-transform: uppercase; }
  .progress { height: 3px; background: transparent; }
  .progress > div { height: 100%; width: 0; background: var(--green); transition: width 0.15s linear; }

  /* ---------- article ---------- */
  .wrap { max-width: 40rem; margin: 0 auto; padding: 0 1.35rem 4rem; }
  main.reading { padding-top: 4.4rem; font-family: var(--serif); font-size: 20px; line-height: 1.68; }
  .art { padding: 2.4rem 0 1rem; }
  .art-head {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: var(--ink); cursor: pointer; padding: 0;
  }
  .kicker {
    display: flex; gap: 0.8rem; align-items: baseline; flex-wrap: wrap;
    font-family: var(--ui); font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--gold); font-weight: 700; margin-bottom: 0.9rem;
  }
  .kicker a.ref { color: var(--gold); border-bottom: 1px solid var(--gold-line); }
  .kicker .mins { color: var(--mute); letter-spacing: 0.08em; font-weight: 500; }
  .art h1 {
    font-family: var(--head); font-weight: 600;
    font-size: 2.15rem; line-height: 1.12; letter-spacing: -0.01em; margin-bottom: 0.9rem;
  }
  .read-badge {
    display: none; align-items: center; gap: 0.45rem; font-family: var(--ui);
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--mute); font-weight: 700; margin-bottom: 0.4rem;
  }
  .read-badge .chev { color: var(--green); }
  .dek {
    font-size: 1.18rem; line-height: 1.5; font-style: italic; color: var(--mute);
    margin-bottom: 1.9rem;
  }
  .body p { margin-bottom: 1.25rem; }
  .body p:first-of-type::first-letter {
    font-family: var(--head); font-size: 3.4em; float: left; line-height: 0.82; padding: 0.08em 0.12em 0 0;
    color: var(--green); font-weight: 600;
  }
  .body blockquote {
    margin: 2rem 0.4rem; padding: 0 0 0 1.15rem; border-left: 3px solid var(--gold);
    font-family: var(--head); font-size: 1.22rem; line-height: 1.5; color: var(--green); font-weight: 500;
  }
  .body strong { color: var(--ink); }
  .end-mark { text-align: center; color: var(--gold); font-size: 1.6rem; padding: 1.6rem 0 0.2rem; }
  .art-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: .6rem; font-family: var(--ui); }
  .art-actions .btn { min-height: 44px; }
  .collapse-btn { color: var(--mute); }
  /* collapsed state: hide the reading body + drop cap, reveal the "read" badge */
  .art.collapsed .art-body { display: none; }
  .art.collapsed .art-head h1 { margin-bottom: 0.2rem; opacity: 0.72; }
  .art.collapsed .read-badge { display: flex; }
  .read-badge .heart { color: var(--green); }
  .love-btn.loved { color: var(--green); border-color: var(--green); }
  .print-head { display: none; }

  /* ---------- listen (narrated article) ---------- */
  .listen {
    display: flex; align-items: center; gap: 0.85rem; font-family: var(--ui);
    margin: 1.6rem 0 0.4rem; padding: 0.7rem 0.9rem;
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
  }
  .art.collapsed .listen { margin-bottom: 0.9rem; }
  .listen-play {
    flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%;
    border: none; cursor: pointer; background: var(--green); color: #fff;
    font-size: 0.9rem; line-height: 1; display: flex; align-items: center;
    justify-content: center; padding-left: 0.12em;
  }
  .listen.playing .listen-play { background: var(--green-deep); padding-left: 0; }
  .listen-play:disabled { background: var(--line); cursor: default; }
  .listen-mid { flex: 1; min-width: 0; }
  .listen-bar { height: 5px; border-radius: 3px; background: var(--line); cursor: pointer; overflow: hidden; }
  .listen-fill { height: 100%; width: 0; background: var(--green); border-radius: 3px; }
  .listen-time {
    display: flex; justify-content: space-between; gap: 0.6rem;
    margin-top: 0.35rem; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; font-weight: 700; color: var(--mute);
  }
  .listen-rate {
    flex: none; background: none; border: 1px solid var(--line); border-radius: 999px;
    cursor: pointer; color: var(--mute); font-size: 12px; font-weight: 700; padding: 0.28rem 0.6rem;
  }

  /* ---------- print / Save-as-PDF: isolate one article, drop all UI ---------- */
  /* margin:0 suppresses the browser's own URL/date header & footer; the page
     whitespace is provided by padding on the article instead. */
  @page { margin: 0; }
  @media print {
    .topbar, .progress, .finish, .divider, .art-actions,
    .read-badge, .kicker .mins, .listen { display: none !important; }
    body { background: #fff; }
    main.reading { padding-top: 0 !important; }
    .wrap { max-width: 100%; padding: 0; }
    body.printing .art { display: none !important; }
    body.printing .art.print-target { display: block !important; padding: 1.5cm 1.3cm !important; }
    body.printing .art.print-target .art-body { display: block !important; }
    .art.print-target .print-head {
      display: block; text-align: center; margin-bottom: 1.4rem; color: var(--green); font-family: var(--ui);
      font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700;
    }
    .art h1 { page-break-after: avoid; }
    .body blockquote { page-break-inside: avoid; }
  }

  .divider {
    display: flex; align-items: center; gap: 1rem; color: var(--mute); font-family: var(--ui);
    font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; padding: 1.2rem 0 0;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .finish { text-align: center; padding: 3rem 0 2rem; color: var(--mute); font-style: italic; }
  .finish .verse { font-family: var(--head); font-size: 1.05rem; margin-bottom: 1.6rem; }
  .finish .big { font-style: normal; align-items: center; text-align: center; font-family: var(--ui); }
  .allread {
    margin: 0.6rem 0 1.6rem; padding: 1rem 1.2rem; background: var(--paper); border: 1px solid var(--line);
    border-radius: 14px; text-align: center; color: var(--mute); font-family: var(--ui); font-size: 15px;
  }
  .allread strong { color: var(--ink); }

  @media (min-width: 700px) {
    main.reading { font-size: 21px; }
    .art h1 { font-size: 2.5rem; }
  }
  @media (max-width: 900px) {
    .reads { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tools, .tools.n2 { grid-template-columns: minmax(0, 1fr); }
  }

  /* ---------- phone ---------- */
  @media (max-width: 640px) {
    .top { padding: 16px 16px 0; gap: 10px; }
    .top-k { display: inline; font-size: 11.5px; }
    .top .build, .hero .k { display: none; }
    .foot-build { display: block; }
    .obback, .btn, .look input { min-height: 44px; height: auto; }
    .obback { height: 44px; }
    .col { padding: 14px 16px 28px; gap: 14px; }
    .hero h1 { font-size: 32px; line-height: 1.1; }
    .sub { font-size: 13.5px; }
    .reads { display: block; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 6px 16px; }
    .rd { flex-direction: row; justify-content: space-between; gap: 12px; padding: 11px 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none; }
    .rd:last-child { border-bottom: 0; }
    .rd .l { padding-top: 3px; flex: none; }
    .wide { display: none; }
    .narrow { display: inline; }
    .rd .v { font-size: 16.5px; text-align: right; }
    .big { padding: 18px; }
    .big b { font-size: 20px; }
    .big span { font-size: 13px; }
    .card { padding: 16px; }
    .card h2 { font-size: 18px; }
    .browse-row { display: block; }
    .days { flex-wrap: nowrap; overflow-x: auto; gap: 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .days::-webkit-scrollbar { display: none; }
    .dy { flex: 0 0 52px; min-width: 52px; height: 60px; padding: 0; }
    .dy small { font-size: 10.5px; }
    .look { margin: 12px 0 0; }
    .look { align-items: center; }
    .look label { flex: none; }
    .look input { flex: 1; min-width: 0; border-radius: 12px; font-size: 15px; padding: 0 12px; }
    .btn { border-radius: 12px; font-size: 14px; }
    .tools { display: block; }
    .tool { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .tool:first-child { padding-top: 0; }
    .tool:last-child { border-bottom: 0; padding-bottom: 0; }
    .tool .x { gap: 0; }
    .tool .h { font-weight: 600; }
    .tool .d { font-size: 12px; }
    .tool .gen-note { grid-column: 1 / -1; }
    .topbar-inner { padding: 6px 16px; }
    .topbar .obback { height: 44px; }
    .listen-play { width: 44px; height: 44px; }
    .listen-rate { min-height: 44px; min-width: 44px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  const app = document.getElementById("app");
  const today = new Date();
  const todayIso = ymd(today);

  // Shown small on the home screen. Its only job is to answer "is the phone
  // actually running the code I just shipped?" — a question that cost a whole
  // debugging round when an iPhone kept serving a cached app that looked fine.
  const BUILD = "10";

  // [key, label on desktop, label on a phone]
  const READING_TAGS = [["psalm", "Psalm", "Psalm"], ["ot", "Old Testament", "Old Test."],
    ["nt", "New Testament", "New Test."], ["prov", "Proverbs", "Proverbs"]];
  let todayData = null;      // today's articles (or null if not generated)
  let apiOk = false;         // true when the generator server is reachable
  let apiBase = "";          // "" = same-origin (on the Mac); tailnet URL when remote
  let apiInfo = null;        // the generator's ping payload (window size, days missing)
  const TAILNET = "https://kriss-macbook-pro.taila0e65f.ts.net:8790"; // Mac over Tailscale
  function api(path) { return apiBase ? apiBase + "/" + path : path; }
  let remoteLoved = new Set(); // loved keys synced from the Mac via loved.json
  let plan = {};             // MM-DD -> readings, for any date's passages
  let generatedSet = new Set(); // ISO dates that have articles
  let audioIndex = {};       // ISO date -> [ranks] that have a narrated MP3

  // ---------- helpers ----------
  function ymd(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function prettyFromIso(isoStr, withYear) {
    const [y, m, d] = isoStr.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("en-US",
      { weekday: "long", month: "long", day: "numeric", year: withYear ? "numeric" : undefined });
  }
  function esc(s) { const el = document.createElement("div"); el.textContent = s; return el.innerHTML; }
  // A tappable Scripture reference → opens the passage on BibleGateway (NIV).
  function refLink(ref) {
    const url = "https://www.biblegateway.com/passage/?version=NIV&search=" +
      encodeURIComponent(String(ref).replace(/[–—]/g, "-"));
    return '<a class="ref" href="' + url + '" target="_blank" rel="noopener">' + esc(ref) + "</a>";
  }

  // ---------- back to the Ops Board ----------
  // The board runs on port 8788 of the same Mac, so on localhost and over
  // Tailscale the same host works. The public copy lives on github.io, where
  // that would point nowhere, so it goes to the board's tailnet address
  // by its tailnet name (needs Tailscale on, same as every other phone app).
  function boardUrl() {
    if (/(^|\.)github\.io$/.test(location.hostname)) return "https://" + new URL(TAILNET).hostname + ":8788/";   // the board is served over https by tailscale serve
    return location.protocol + "//" + location.hostname + ":8788/";
  }
  function obHtml() {
    return '<a class="obback" data-ob href="' + boardUrl() + '" aria-label="Back to Ops Board" title="Back to Ops Board">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>' +
      '<span class="obl" aria-hidden="true">OB</span></a>';
  }
  // OB button on the Mac: switch to the already-open Daily Ops Board app instead of loading the
  // board in this window (REDESIGN_BRIEF rule 2). Phone and github.io follow the plain link.
  document.addEventListener("click", function (e) {
    if (!e.target.closest || !e.target.closest("a[data-ob]")) return;
    var h = location.hostname;
    if (h !== "localhost" && h !== "127.0.0.1") return;
    e.preventDefault();
    fetch("http://127.0.0.1:8788/focus", { mode: "no-cors", cache: "no-store" })
      .catch(function () { location.href = "http://localhost:8788/"; });
  });

  // ---------- read-state (per device, localStorage) ----------
  function getRead() {
    try { return JSON.parse(localStorage.getItem("dm-read") || "{}"); } catch (e) { return {}; }
  }
  function isRead(isoStr, rank) { return !!getRead()[isoStr + "#" + rank]; }
  function markRead(isoStr, rank) {
    const r = getRead(); const k = isoStr + "#" + rank;
    if (!r[k]) { r[k] = true; try { localStorage.setItem("dm-read", JSON.stringify(r)); } catch (e) {} }
  }
  function readCount(isoStr, articles) {
    return articles.reduce((n, a) => n + (isRead(isoStr, a.rank) ? 1 : 0), 0);
  }

  // ---------- loved-state (device localStorage + synced-down loved.json) ----------
  function getLovedLocal() {
    try { return JSON.parse(localStorage.getItem("dm-loved") || "{}"); } catch (e) { return {}; }
  }
  function isLoved(key) { return !!getLovedLocal()[key] || remoteLoved.has(key); }
  function toggleLove(key) {
    const l = getLovedLocal();
    const now = !l[key];
    if (now) l[key] = true; else delete l[key];
    try { localStorage.setItem("dm-loved", JSON.stringify(l)); } catch (e) {}
    if (now) remoteLoved.add(key); else remoteLoved.delete(key);
    if (apiOk) {
      fetch(api("api/love"), { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key, loved: now }) }).catch(() => {});
    }
    return now;
  }

  // ---------- generator server detection ----------
  // Try same-origin first (running on the Mac); if that fails, try the Mac over
  // Tailscale (phone/anywhere). Returns {base, info} or null.
  function pingUrl(base) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 2800);
    return fetch((base ? base + "/" : "") + "api/ping", { signal: ctrl.signal, cache: "no-store" })
      .then(r => r.ok ? r.json() : null).catch(() => null).finally(() => clearTimeout(t))
      .then(info => info ? { base, info } : null);
  }
  function ping() {
    return pingUrl("").then(res => res || pingUrl(TAILNET));
  }
  function loadRemoteLoved() {
    return fetch("loved.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null)
      .then(d => { if (d && Array.isArray(d.loved)) remoteLoved = new Set(d.loved); })
      .catch(() => {});
  }
  function loadPlan() {
    return fetch("plan.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {})
      .then(p => { plan = p; }).catch(() => {});
  }
  function loadGenerated() {
    return fetch("content/index.json", { cache: "no-store" }).then(r => r.ok ? r.json() : { days: [] })
      .then(idx => { generatedSet = new Set(idx.days || []); }).catch(() => {});
  }
  // Which articles have narration. Missing file just means no Listen buttons.
  function loadAudioIndex() {
    return fetch("audio/index.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {})
      .then(idx => { audioIndex = idx || {}; }).catch(() => {});
  }
  function hasAudio(isoStr, rank) {
    return (audioIndex[isoStr] || []).indexOf(rank) !== -1;
  }
  // Narration lives in its own repo, served over its own Pages site, so this
  // repo stays small — MP3s were the only thing growing by megabytes a day, and
  // in-tree every one ever rendered stayed in git history forever.
  //
  // NOT GitHub Releases, which was tried and cannot work: release downloads are
  // served Content-Type: application/octet-stream with Content-Disposition:
  // attachment, hardcoded into the signed URL, and Safari refuses to play audio
  // on those. It failed on the phone while Chrome, which sniffs the bytes,
  // played it and hid the fault. Pages sends audio/mp3 and honours byte ranges,
  // which the player needs both to start and to seek.
  const AUDIO_BASE = "https://polarstellar.github.io/daily-manna-audio";
  function audioUrl(isoStr, rank) {
    return AUDIO_BASE + "/" + isoStr + "/" + rank + ".mp3";
  }
  function goToday() {
    if (todayData) renderHome(); else renderMissing(plan[todayIso.slice(5)]);
  }

  // Generate a specific date; onSuccess(data) fires when the articles are ready.
  function runGenerate(iso, btn, noteEl, force, onSuccess) {
    btn.disabled = true;
    setBtnLabel(btn, "Writing the articles…");
    const fail = (msg) => { btn.disabled = false; setBtnLabel(btn, "Try again"); noteEl.textContent = msg; };
    const poll = () => {
      fetch(api("api/gen-status"), { cache: "no-store" }).then(r => r.json()).then(s => {
        if (s.running) { noteEl.textContent = phaseText(s.phase) + " (this takes a few minutes)"; return setTimeout(poll, 3000); }
        if (s.done && s.result) {
          if (s.result.ok && s.result.articles) {
            const data = { date: iso, readings: plan[iso.slice(5)] || {}, articles: s.result.articles };
            dayCache[iso] = data; generatedSet.add(iso);
            if (iso === todayIso) todayData = data;
            noteEl.textContent = "Done!";
            onSuccess(data);
          } else fail("Couldn’t generate: " + (s.result.error || "unknown error"));
        } else { setTimeout(poll, 3000); }
      }).catch(e => setTimeout(poll, 4000));
    };
    fetch(api("api/generate"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ date: iso, force: !!force }) })
      .then(r => r.json())
      .then(res => { if (res.ok) { noteEl.textContent = "Starting…"; poll(); } else fail("Couldn’t start: " + (res.error || "unknown")); })
      .catch(e => fail("Couldn’t reach the generator: " + e));
  }
  function generateToday(btn, noteEl, force) { runGenerate(todayIso, btn, noteEl, force, () => renderHome()); }
  // The server's progress lines use em dashes ("Day 1 of 3 (…) — writing…").
  function phaseText(phase) { return (phase || "Working…").replace(/\s*—\s*/g, ": "); }
  // The big buttons keep their label in a <b>; plain buttons are just text.
  function setBtnLabel(btn, text) {
    const b = btn.querySelector("b");
    if (b) b.textContent = text; else btn.textContent = text;
  }

  // ---------- tools: only when the generator is reachable ----------
  // On the public site with the Mac asleep there is nothing they could do.
  // Desktop text, and the shorter version a phone shows instead.
  function wn(wide, narrow) {
    return '<span class="wide">' + wide + '</span><span class="narrow">' + narrow + "</span>";
  }
  function toolHtml(title, desc, action, noteId) {
    return '<div class="tool"><div class="x"><span class="h">' + title + '</span><span class="d">' + desc + "</span></div>" +
      action + '<div class="gen-note" id="' + noteId + '"></div></div>';
  }
  function toolsHtml(regenTitle) {
    if (!apiOk) return "";
    const tools = [];
    if (regenTitle) {
      tools.push(toolHtml(regenTitle, wn("Rewrites the articles from the same passages.", "Rewrites from the same passages"),
        '<button class="btn" id="regen">' + wn("Regenerate", "Run") + "</button>", "regen-note"));
    }
    tools.push(weekToolHtml(), restartToolHtml());
    return '<section class="card" aria-label="Mac tools"><div class="tools n' + tools.length + '">' + tools.join("") + "</div></section>";
  }

  // ---------- "next 7 days" ----------
  // One tap fills every empty day in the rolling week. The work happens on the
  // Mac, not here: the server walks the days itself, so the phone can lock and
  // the tab can close mid-run without stopping it.
  function weekDays() { return (apiInfo && apiInfo.windowDays) || 7; }
  function weekToolHtml() {
    const missing = apiInfo && typeof apiInfo.missing === "number" ? apiInfo.missing : null;
    const days = weekDays();
    const title = "Generate the next " + days + " days";
    if (missing === 0) {
      return toolHtml(title, wn("Skips days already written. Runs on your Mac.", "Runs on your Mac"),
        '<span class="done">' + wn("All " + days + " days are already written", "All written") + "</span>", "week-note");
    }
    const state = missing === null ? "Writes today and the next " + (days - 1) + "."
      : missing + (missing === 1 ? " day" : " days") + " still empty.";
    return toolHtml(title, state + wn(" Runs on your Mac, about half an hour.", ""),
      '<button class="btn" id="genweek">Generate</button>', "week-note");
  }

  function wireWeekBtn(afterDone) {
    const btn = document.getElementById("genweek");
    if (!btn) return;
    const note = document.getElementById("week-note");
    const label = btn.innerHTML;
    const reset = () => { btn.disabled = false; btn.innerHTML = label; };
    btn.onclick = () => {
      const days = weekDays();
      if (!confirm("Write articles for every empty day in the next " + days +
                   " days?\n\nThis runs on your Mac and can take a while. You can close this and come back.")) return;
      btn.disabled = true;
      btn.textContent = "Working…";
      const poll = () => {
        fetch(api("api/gen-status"), { cache: "no-store" }).then(r => r.json()).then(s => {
          if (s.running) {
            note.textContent = phaseText(s.phase);
            return setTimeout(poll, 3000);
          }
          const res = s.result || {};
          const madeCount = (res.generated || []).length;
          note.textContent = res.failed && res.failed.length
            ? "Wrote " + madeCount + "; couldn’t write " + res.failed.join(", ") + ". Tap to try again."
            : "Done. Wrote " + madeCount + (madeCount === 1 ? " day." : " days.");
          reset();
          // Pull the new days into the app so they are readable immediately.
          Promise.all([loadGenerated(), pingRefresh()])
            .then(() => loadDay(todayIso).then(d => { todayData = d; }).catch(() => {}))
            .then(() => { if (afterDone) afterDone(); });
        }).catch(() => setTimeout(poll, 4000));
      };
      fetch(api("api/generate-week"), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ days: days })
      }).then(r => r.json()).then(res => {
        if (res.nothingToDo) {
          note.textContent = res.message || "Nothing to write. Every day is done.";
          reset();
          return;
        }
        if (!res.ok) {
          note.textContent = "Couldn’t start: " + (res.error || "unknown");
          reset();
          return;
        }
        note.textContent = res.total ? "Writing " + res.total + " days…" : "Starting…";
        poll();
      }).catch(e => {
        note.textContent = "Couldn’t reach the generator: " + e.message;
        reset();
      });
    };
  }

  // Restarting the Mac's server used to mean walking to the Mac — useless when
  // the reason to restart is something noticed on the phone. This pulls the
  // latest code and re-execs it. The server refuses to restart if the new code
  // will not compile, so this cannot strand the phone with nothing listening.
  function restartToolHtml() {
    return toolHtml("Mac server", wn("Pulls the latest build and restarts the Mac server.", "Update &amp; restart"),
      '<button class="btn" id="restart">' + wn("Update &amp; restart", "Restart") + "</button>", "restart-note");
  }

  function wireRestart() {
    const btn = document.getElementById("restart");
    if (!btn) return;
    const note = document.getElementById("restart-note");
    btn.onclick = () => {
      if (!confirm("Pull the latest code and restart the Mac's server?")) return;
      btn.disabled = true;
      const label = btn.innerHTML;
      btn.textContent = "Restarting…";
      // Wait for it to come back rather than claiming success immediately.
      const waitForIt = (pulled) => {
        let tries = 0;
        const wait = () => {
          tries++;
          pingUrl(apiBase).then(p => {
            if (p) {
              apiInfo = p.info;
              note.textContent = "Back up ✓" + (pulled ? " · " + pulled.split("\n")[0] : "");
              btn.disabled = false; btn.innerHTML = label;
            } else if (tries < 15) {
              setTimeout(wait, 1500);
            } else {
              note.textContent = "It hasn’t come back. Check the Mac.";
              btn.disabled = false; btn.innerHTML = label;
            }
          });
        };
        setTimeout(wait, 2000);
      };
      fetch(api("api/restart"), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pull: true })
      }).then(r => r.json()).then(res => {
        if (!res.ok) {
          note.textContent = res.error || "Couldn’t restart.";
          btn.disabled = false; btn.innerHTML = label;
          return;
        }
        note.textContent = "Restarting" + (res.warning ? " (" + res.warning + ")" : "") + "…";
        waitForIt(res.pulled);
      }).catch(e => {
        // A dropped connection mid-restart is expected; keep polling.
        note.textContent = "Restarting…";
        waitForIt(null);
      });
    };
  }

  // Re-read the generator's ping so the "n days still empty" line is current.
  function pingRefresh() {
    return pingUrl(apiBase).then(p => { if (p) apiInfo = p.info; }).catch(() => {});
  }

  // ---------- shared pieces ----------
  function readsHtml(readings) {
    return '<div class="reads">' +
      READING_TAGS.map(([k, full, short]) => readings[k]
        ? '<div class="rd"><span class="l">' + wn(full, short) + "</span>" +
          '<span class="v">' + refLink(readings[k]) + "</span></div>"
        : "").join("") +
      "</div>";
  }
  // Days written past today: "6 days banked, to Nov 12".
  function bankedAhead() {
    return [...generatedSet].filter(d => d > todayIso).sort();
  }
  function buildLine() {
    const ahead = bankedAhead();
    return "build " + BUILD + " · " + (ahead.length
      ? ahead.length + (ahead.length === 1 ? " day" : " days") + " banked, to " + shortIso(ahead[ahead.length - 1])
      : "nothing banked past today");
  }
  function topHtml(extra) {
    return '<header class="top">' + obHtml() + '<span class="k top-k">Daily Manna</span>' + (extra || "") +
      '<span class="sp"></span><span class="build">' + esc(buildLine()) + "</span></header>";
  }
  function heroHtml() {
    return '<div class="hero"><div class="k">Daily Manna</div><h1>' + prettyFromIso(todayIso, false) + "</h1>" +
      '<div class="sub">Fresh articles from today’s passages, every morning.</div></div>';
  }
  function footHtml() {
    return '<div class="build foot-build">' + esc(buildLine()) + "</div>";
  }

  // ---------- browse by date ----------
  // A short row of nearby days (5 back, today, up to 3 written ahead) and a
  // date field for anything else, instead of a month grid.
  function browseHtml() {
    const ahead = bankedAhead();
    const lastAhead = ahead.length ? ahead[Math.min(ahead.length, 3) - 1] : null;
    let btns = "";
    for (let i = -5; i <= 3; i++) {
      const iso = shiftIso(todayIso, i);
      if (i > 0 && (!lastAhead || iso > lastAhead)) break;
      const [y, m, d] = iso.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      const has = generatedSet.has(iso);
      const cls = "dy" + (i === 0 ? " on" : i > 0 && has ? " f" : !has ? " none" : "");
      const label = prettyFromIso(iso, false) + (has ? ", articles ready" : ", no articles yet");
      btns += '<button class="' + cls + '" data-iso="' + iso + '" aria-label="' + label + '"' + (i === 0 ? ' aria-current="date"' : "") + ">" +
        "<small>" + (i === 0 ? "Today" : dt.toLocaleDateString("en-US", { weekday: "short" })) + "</small><b>" + d + "</b></button>";
    }
    return '<section class="card"><h2>Browse by date</h2>' +
      '<div class="browse-row"><div class="days" id="days">' + btns + "</div>" +
      '<div class="look"><label for="other-date">Other date</label>' +
      '<input type="date" id="other-date" aria-label="Other date">' +
      '<button class="btn g" id="open-date">Open</button></div></div>' +
      (btns.includes('dy f"') ? '<div class="hint">Gold days are already written and waiting.</div>' : "") +
      "</section>";
  }
  function wireBrowse() {
    app.querySelectorAll(".dy[data-iso]").forEach(c => { c.onclick = () => openDate(c.dataset.iso); });
    const input = document.getElementById("other-date");
    const open = () => {
      if (input.value) return openDate(input.value);
      if (input.showPicker) { try { input.showPicker(); return; } catch (e) {} }
      input.focus();
    };
    document.getElementById("open-date").onclick = open;
    input.onkeydown = (e) => { if (e.key === "Enter") open(); };
    // On a phone the row scrolls; start it with today in view, 3 days of history to its left.
    const row = document.getElementById("days");
    const on = row.querySelector(".dy.on");
    if (on && row.scrollWidth > row.clientWidth) row.scrollLeft = Math.max(0, on.offsetLeft - row.offsetLeft - 3 * 58);
  }

  // ---------- home ----------
  function renderHome() {
    window.scrollTo(0, 0);
    if (!todayData) return; // renderMissing already showed
    const total = todayData.articles.reduce((s, a) => s + a.minutes, 0);
    const done = readCount(todayIso, todayData.articles);
    const n = todayData.articles.length;
    const left = n - done;
    const primaryLabel = done === 0
      ? "Read today’s " + n + " articles"
      : (left > 0 ? "Continue: " + left + " left to read" : "Reread today’s articles");
    const primarySmall = done === 0 ? total + " minute read" : done + " of " + n + " read";
    app.innerHTML =
      '<div id="home-view">' + topHtml() +
      '<div class="col">' +
      heroHtml() +
      readsHtml(todayData.readings) +
      '<button class="big p" id="read-all"><b>' + primaryLabel + "</b><span>" + primarySmall + "</span></button>" +
      browseHtml() +
      toolsHtml("Regenerate today") +
      footHtml() +
      "</div></div>";
    document.getElementById("read-all").onclick = () => openDay(todayIso, todayData, renderHome);
    wireBrowse();
    wireWeekBtn(renderHome);
    wireRestart();
    const regen = document.getElementById("regen");
    if (regen) regen.onclick = () => {
      if (!confirm("Rewrite today’s 4 articles? This replaces the current set.")) return;
      generateToday(regen, document.getElementById("regen-note"), true);
    };
  }

  function renderMissing(planReadings) {
    window.scrollTo(0, 0);
    app.innerHTML =
      '<div id="home-view">' + topHtml() +
      '<div class="col">' +
      heroHtml() +
      (planReadings ? readsHtml(planReadings) : "") +
      '<section class="card missing-card"><h2>Today’s articles aren’t ready yet</h2>' +
      (apiOk
        ? "<p>Tap below and Daily Manna will write today’s four articles for you.</p>" +
          '<div><button class="big p" id="gen"><b>Generate today’s devotions</b><span>Runs on your Mac, a few minutes</span></button>' +
          '<div class="gen-note" id="gen-note"></div></div>'
        : "<p>Open the app on your Mac (or say <em>“today’s devotions”</em> in Claude Code) to generate them.</p>" +
          "<p>In the meantime, today’s passages are listed above. The Word itself is always ready.</p>") +
      "</section>" +
      browseHtml() +
      toolsHtml(null) +
      footHtml() +
      "</div></div>";
    wireBrowse();
    wireWeekBtn(goToday);
    wireRestart();
    const gen = document.getElementById("gen");
    if (gen) gen.onclick = () => generateToday(gen, document.getElementById("gen-note"));
  }

  // ---------- dates ----------
  function isoFor(y, m, d) {
    return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }
  function shiftIso(iso, delta) {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(y, m - 1, d + delta);
    return isoFor(dt.getFullYear(), dt.getMonth(), dt.getDate());
  }
  function shortIso(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  function openDate(iso) {
    if (iso === todayIso) return goToday();
    renderDayCard(iso);
  }

  // A single date's page: its readings, then Read (if it has articles) or Generate.
  function renderDayCard(iso) {
    window.scrollTo(0, 0);
    const readings = plan[iso.slice(5)];
    const has = generatedSet.has(iso);
    const back = () => renderDayCard(iso);
    app.innerHTML =
      topHtml('<button class="btn" id="back">‹ Today</button>') +
      '<div class="col">' +
      '<div class="hero"><div class="k">Daily Manna</div><h1>' + prettyFromIso(iso, true) + "</h1>" +
      '<div class="day-nav"><button class="btn" id="prevday">‹ ' + shortIso(shiftIso(iso, -1)) + "</button>" +
      '<button class="btn" id="nextday">' + shortIso(shiftIso(iso, 1)) + " ›</button></div></div>" +
      (readings ? readsHtml(readings)
        : '<section class="card"><p>No reading plan entry for this date.</p></section>') +
      (readings && has
        ? '<div class="cta"><button class="big p" id="read-all"><b>Read this day’s articles</b><span>Articles ready</span></button></div>' +
          toolsHtml("Regenerate this day")
        : readings
          ? (apiOk
              ? '<section class="card missing-card"><h2>No articles for this day yet</h2>' +
                '<div><button class="big p" id="gen"><b>Generate this day’s devotions</b><span>Runs on your Mac, a few minutes</span></button>' +
                '<div class="gen-note" id="gen-note"></div></div></section>'
              : '<section class="card"><p>No articles yet. Open this day on your Mac to generate them.</p></section>')
          : "") +
      footHtml() +
      "</div>";
    document.getElementById("back").onclick = goToday;
    document.getElementById("prevday").onclick = () => openDate(shiftIso(iso, -1));
    document.getElementById("nextday").onclick = () => openDate(shiftIso(iso, 1));
    wireWeekBtn(back);
    wireRestart();
    if (readings && has) {
      // These used to be bare .then() chains. When loadDay rejected — a flaky
      // connection, or a day this device has never cached — the rejection went
      // nowhere: no article, no error, the button just sat there looking dead.
      // Failure now says so on screen and can be tapped again.
      const readAllBtn = document.getElementById("read-all");
      readAllBtn.onclick = () => {
        const label = readAllBtn.querySelector("b").textContent;
        readAllBtn.disabled = true;
        setBtnLabel(readAllBtn, "Opening…");
        loadDay(iso)
          .then(d => openDay(iso, d, back))
          .catch(err => {
            readAllBtn.disabled = false;
            setBtnLabel(readAllBtn, label);
            let note = document.getElementById("open-err");
            if (!note) {
              note = document.createElement("div");
              note.className = "gen-note";
              note.id = "open-err";
              readAllBtn.parentNode.appendChild(note);
            }
            note.textContent = navigator.onLine
              ? "Couldn’t load this day. " + (err.name || "Error") + ": " + err.message
                + " · build " + BUILD + " · tap to retry"
              : "You’re offline, and this day isn’t saved on this device yet. Tap again once you have a connection.";
          });
      };
      const rg = document.getElementById("regen");
      if (rg) rg.onclick = () => {
        if (!confirm("Rewrite this day’s 4 articles? This replaces the current set.")) return;
        runGenerate(iso, rg, document.getElementById("regen-note"), true, (d) => openDay(iso, d, back));
      };
    } else if (readings && apiOk) {
      const gen = document.getElementById("gen");
      if (gen) gen.onclick = () => runGenerate(iso, gen, document.getElementById("gen-note"), false,
        (d) => openDay(iso, d, back));
    }
  }

  const dayCache = {};
  function loadDay(isoStr) {
    if (dayCache[isoStr]) return Promise.resolve(dayCache[isoStr]);
    const url = "content/" + isoStr + ".json";
    const keep = (d) => { dayCache[isoStr] = d; return d; };
    // "no-store" is what stops a just-generated day arriving stale, but it also
    // turns a dropped connection into a hard failure. So when the network says
    // no, ask the offline cache before giving up — a day already read on this
    // device should still open on a train with no signal.
    const asJson = (r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); };
    return fetch(url, { cache: "no-store" })
      .then(asJson)
      .catch((first) =>
        // iOS Safari can fail a cache:"no-store" fetch outright when a service
        // worker is in front of it — the desktop never sees this, which is why
        // this worked everywhere except the phone. Retry as an ordinary request
        // with a cache-busting query instead of giving up.
        fetch(url + "?t=" + Date.now()).then(asJson).catch(() => { throw first; })
      )
      .then(keep)
      .catch((err) =>
        // Last resort: whatever the offline cache is holding.
        (window.caches ? caches.match(url, { ignoreVary: true }) : Promise.resolve(null))
          .catch(() => null)
          .then((hit) => {
            if (hit && hit.ok) return hit.json().then(keep);
            throw err;
          })
      );
  }

  // Save one article as a PDF via the browser's print-to-PDF (works on phone
  // via the share sheet). We isolate the target article, print, then restore.
  function exportPdf(sec) {
    const wasCollapsed = sec.classList.contains("collapsed");
    sec.classList.remove("collapsed");
    document.body.classList.add("printing");
    sec.classList.add("print-target");
    let done = false;
    const cleanup = () => {
      if (done) return; done = true;
      window.removeEventListener("afterprint", cleanup);
      document.body.classList.remove("printing");
      sec.classList.remove("print-target");
      if (wasCollapsed) sec.classList.add("collapsed");
    };
    window.addEventListener("afterprint", cleanup);
    setTimeout(cleanup, 60000);       // fallback if afterprint never fires (some mobile browsers)
    setTimeout(() => window.print(), 80);
  }

  // ---------- reading ----------
  function articleHtml(a, idx, count, isoStr, collapsed) {
    const key = isoStr + "#" + a.rank;
    const loved = isLoved(key);
    return '<section class="art' + (collapsed ? " collapsed" : "") + '" data-rank="' + a.rank + '">' +
      '<div class="print-head">Daily Manna &middot; ' + esc(prettyFromIso(isoStr, true)) + "</div>" +
      (idx > 0 ? '<div class="divider">Article ' + (idx + 1) + " of " + count + "</div>" : "") +
      // Above the headline and outside .art-body on purpose: it has to be the
      // first thing you see, and it has to stay reachable on an article you've
      // already read (those render collapsed, which hides .art-body).
      (hasAudio(isoStr, a.rank)
        ? '<div class="listen" data-src="' + audioUrl(isoStr, a.rank) + '">' +
          '<button class="listen-play" aria-label="Listen to this article">▶</button>' +
          '<div class="listen-mid"><div class="listen-bar"><div class="listen-fill"></div></div>' +
          '<div class="listen-time"><span class="listen-label">Listen to this article</span>' +
          '<span class="listen-clock"></span></div></div>' +
          '<button class="listen-rate" aria-label="Playback speed">1×</button>' +
          "</div>"
        : "") +
      '<button class="art-head">' +
      '<div class="kicker"><span>' + refLink(a.passage) + '</span><span class="mins">' + a.minutes + " min read</span></div>" +
      "<h1>" + esc(a.title) + "</h1>" +
      '<div class="read-badge"><span class="chev">✓</span> Read · tap to reopen' +
      (loved ? ' <span class="heart">♥</span>' : "") + "</div>" +
      "</button>" +
      '<div class="art-body">' +
      '<p class="dek">' + esc(a.dek) + "</p>" +
      '<div class="body">' + a.body + "</div>" +
      '<div class="end-mark">❦</div>' +
      '<div class="art-actions">' +
      '<button class="btn love-btn' + (loved ? " loved" : "") + '" data-key="' + key + '">' +
      '<span class="ic">' + (loved ? "♥" : "♡") + '</span> ' + (loved ? "Loved" : "Love this") + "</button>" +
      '<button class="btn export-btn">⬇ Save as PDF</button>' +
      '<button class="btn collapse-btn">Collapse ▲</button>' +
      "</div></div></section>";
  }

  // ---------- listen ----------
  // One narrated MP3 per article (audio/<date>/<rank>.mp3). The <audio> element
  // is created on first tap so opening a day never pulls down four files.
  let nowPlaying = null;     // the only element allowed to be playing
  const RATES = [1, 1.25, 1.5, 0.85];

  function clock(s) {
    if (!isFinite(s)) return "";
    const m = Math.floor(s / 60);
    return m + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  }

  function setupListen(sec, isoStr) {
    const box = sec.querySelector(".listen");
    if (!box) return;
    const src = box.dataset.src;
    const playBtn = box.querySelector(".listen-play");
    const rateBtn = box.querySelector(".listen-rate");
    const fill = box.querySelector(".listen-fill");
    const bar = box.querySelector(".listen-bar");
    const label = box.querySelector(".listen-label");
    const clockEl = box.querySelector(".listen-clock");
    const posKey = "dm-audio-pos:" + src;
    let audio = null;

    const paint = () => {
      const d = audio && audio.duration;
      const t = audio ? audio.currentTime : 0;
      fill.style.width = (d ? (t / d) * 100 : 0) + "%";
      clockEl.textContent = d ? clock(t) + " / " + clock(d) : "";
    };

    const make = () => {
      if (audio) return audio;
      audio = new Audio(src);
      audio.preload = "metadata";
      audio.playbackRate = RATES[Number(rateBtn.dataset.i || 0)];
      const saved = Number(localStorage.getItem(posKey) || 0);
      audio.addEventListener("loadedmetadata", () => {
        // Resume where you stopped, unless you were basically done.
        if (saved > 3 && saved < audio.duration - 5) audio.currentTime = saved;
        paint();
      });
      audio.addEventListener("timeupdate", () => {
        paint();
        try { localStorage.setItem(posKey, String(audio.currentTime)); } catch (e) {}
      });
      audio.addEventListener("ended", () => {
        playBtn.textContent = "▶";
        box.classList.remove("playing");
        try { localStorage.removeItem(posKey); } catch (e) {}
        markRead(isoStr, Number(sec.dataset.rank));   // heard it end = read it
        label.textContent = "Finished";
      });
      audio.addEventListener("error", () => {
        // Nearly always a stale app asking for a path that has since moved.
        // selfUpdate() should have caught it; say so plainly if it did not.
        label.textContent = "Audio didn’t load. Tap to refresh the app";
        playBtn.disabled = false;
        playBtn.textContent = "↻";
        playBtn.onclick = () => {
          try { sessionStorage.removeItem("dm-updated-to"); } catch (e) {}
          const jobs = [];
          if (window.caches) jobs.push(caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).catch(() => {}));
          if (navigator.serviceWorker) {
            jobs.push(navigator.serviceWorker.getRegistrations()
              .then(rs => Promise.all(rs.map(r => r.unregister()))).catch(() => {}));
          }
          Promise.all(jobs).then(() => location.reload());
        };
      });
      return audio;
    };

    playBtn.onclick = () => {
      const a = make();
      if (a.paused) {
        if (nowPlaying && nowPlaying !== a) nowPlaying.pause();
        nowPlaying = a;
        a.play().catch(() => { label.textContent = "Tap again to play"; });
        playBtn.textContent = "❚❚";
        box.classList.add("playing");
        label.textContent = "Listening";
      } else {
        a.pause();
        playBtn.textContent = "▶";
        box.classList.remove("playing");
        label.textContent = "Paused";
      }
    };

    rateBtn.onclick = () => {
      const i = (Number(rateBtn.dataset.i || 0) + 1) % RATES.length;
      rateBtn.dataset.i = String(i);
      rateBtn.textContent = RATES[i] + "×";
      if (audio) audio.playbackRate = RATES[i];
    };

    bar.onclick = (e) => {
      const a = make();
      if (!a.duration) return;
      const r = bar.getBoundingClientRect();
      a.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * a.duration;
      paint();
    };

    // Collapsing an article stops its narration.
    sec.querySelector(".collapse-btn").addEventListener("click", () => {
      if (audio && !audio.paused) {
        audio.pause();
        playBtn.textContent = "▶";
        box.classList.remove("playing");
      }
    });
  }

  function openDay(isoStr, data, onBack) {
    const arts = data.articles.slice().sort((x, y) => x.rank - y.rank);
    const unreadCount = arts.filter(a => !isRead(isoStr, a.rank)).length;
    app.innerHTML =
      '<div class="topbar"><div class="topbar-inner">' + obHtml() +
      '<button class="btn" id="back">‹ Back</button>' +
      '<span class="where">' + prettyFromIso(isoStr, false) + "</span></div>" +
      '<div class="progress"><div id="pbar"></div></div></div>' +
      '<main class="reading wrap">' +
      (unreadCount === 0 && arts.length > 1
        ? '<div class="allread"><strong>You’ve read all of these.</strong> Tap any title to read it again.</div>' : "") +
      arts.map((a, i) => articleHtml(a, i, arts.length, isoStr, isRead(isoStr, a.rank))).join("") +
      '<div class="finish"><p class="verse">“Your word is a lamp for my feet, a light on my path.” Psalm 119:105</p>' +
      '<button class="big s" id="done"><b>Done</b></button></div>' +
      "</main>";
    window.scrollTo(0, 0);

    document.getElementById("back").onclick = onBack;
    document.getElementById("done").onclick = onBack;

    // expand / collapse + love toggles
    app.querySelectorAll(".art").forEach(sec => {
      sec.querySelector(".art-head").onclick = () => { if (sec.classList.contains("collapsed")) sec.classList.remove("collapsed"); };
      sec.querySelector(".collapse-btn").onclick = () => {
        sec.classList.add("collapsed");
        sec.scrollIntoView({ block: "start" });
        window.scrollBy(0, -60);
      };
      const lb = sec.querySelector(".love-btn");
      lb.onclick = () => {
        const now = toggleLove(lb.dataset.key);
        lb.classList.toggle("loved", now);
        lb.innerHTML = '<span class="ic">' + (now ? "♥" : "♡") + '</span> ' + (now ? "Loved" : "Love this");
      };
      sec.querySelector(".export-btn").onclick = () => exportPdf(sec);
      setupListen(sec, isoStr);
    });

    // progress bar + mark-as-read: an article counts as read once its end
    // mark scrolls up past the lower part of the viewport. Driven off scroll
    // position (getBoundingClientRect) so it works without IntersectionObserver.
    const pbar = document.getElementById("pbar");
    const ends = [...app.querySelectorAll(".art .end-mark")];
    const update = () => {
      if (!pbar.isConnected) { window.removeEventListener("scroll", update); return; }
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      pbar.style.width = (max > 0 ? ((window.scrollY || h.scrollTop) / max) * 100 : 0) + "%";
      const trigger = window.innerHeight * 0.85;
      ends.forEach(el => {
        if (el.offsetParent === null) return; // inside a collapsed article
        if (el.getBoundingClientRect().top < trigger) markRead(isoStr, Number(el.closest(".art").dataset.rank));
      });
    };
    window.addEventListener("scroll", update, { passive: true });
    update();
  }

  // ---------- boot ----------
  // Offline cache: keeps generated articles readable with no Mac / no VPN / no signal.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
  // todayIso is fixed at load, and the Mac's Dock app (a Brave web app) can stay
  // open for days, so clicking it showed a week-old "today". Reload whenever the
  // window comes back and the date has moved on.
  function reloadIfNewDay() {
    if (!document.hidden && ymd(new Date()) !== todayIso) location.reload();
  }
  document.addEventListener("visibilitychange", reloadIfNewDay);
  window.addEventListener("focus", reloadIfNewDay);
  window.addEventListener("pageshow", reloadIfNewDay);
  // A phone can hold an old index.html indefinitely, and twice now a shipped
  // fix never reached the device — most recently when narration moved out of
  // the git tree and an old build kept asking for a path that no longer exists,
  // showing "Audio unavailable" on articles that were perfectly fine. So the
  // app checks whether it is stale and replaces itself, rather than relying on
  // anyone knowing to clear a cache.
  function selfUpdate() {
    return fetch("index.html?bust=" + Date.now(), { cache: "reload" })
      .then(r => (r.ok ? r.text() : null))
      .then(t => {
        if (!t) return;
        const m = t.match(/const BUILD = "([^"]+)"/);
        if (!m || m[1] === BUILD) return;
        // One attempt per build per tab: if the reload somehow lands on the
        // same old copy, do not spin.
        try {
          if (sessionStorage.getItem("dm-updated-to") === m[1]) return;
          sessionStorage.setItem("dm-updated-to", m[1]);
        } catch (e) { return; }
        const jobs = [];
        if (window.caches) {
          jobs.push(caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).catch(() => {}));
        }
        if (navigator.serviceWorker) {
          jobs.push(navigator.serviceWorker.getRegistrations()
            .then(rs => Promise.all(rs.map(r => r.unregister()))).catch(() => {}));
        }
        return Promise.all(jobs).then(() => location.reload());
      })
      .catch(() => {});
  }

  // Reading must never wait on the generator. Finding the Mac means a same-origin
  // probe plus, off the Mac, a Tailscale URL that is simply unreachable without
  // the VPN — up to ~3s of nothing on the public site, which read like the site
  // needed a VPN it does not need. So: render from the static files first, then
  // let the ping land in its own time and re-render only if it changes anything
  // (i.e. it found a Mac that can generate).
  Promise.all([loadRemoteLoved(), loadPlan(), loadGenerated(), loadAudioIndex()])
    .then(() => loadDay(todayIso).then(d => { todayData = d; }).catch(() => {}))
    .then(() => goToday())
    .then(() => selfUpdate())
    .then(() => ping().then(p => {
      if (!p) return;                       // no Mac reachable — read-only, as rendered
      apiBase = p.base;
      apiInfo = p.info;
      const canGen = !!(p.info && p.info.canGenerate);
      if (canGen === apiOk) return;         // nothing on screen depends on this
      apiOk = canGen;
      // Only redraw if he is still on the home screen. #home-view exists on
      // both home views and nowhere else, so its absence means he already
      // tapped into an article or another date, and a late redraw would throw
      // him out of it.
      if (document.getElementById("home-view")) goToday();
    }));
})();
</script>
</body>
</html>
